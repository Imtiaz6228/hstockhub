<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Telegram 账号市场">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#06365f"/>
      <stop offset="0.5" stop-color="#0f5c97"/>
      <stop offset="1" stop-color="#2a9fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#7fdcff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fdcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ab4ec"/>
      <stop offset="1" stop-color="#0f6aa8"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00243f" flood-opacity="0.30"/>
    </filter>
    <clipPath id="r"><rect width="1200" height="180" rx="22"/></clipPath>
    <style>.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}</style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="180" fill="url(#bg)"/>
    <rect width="1200" height="180" fill="url(#glow)"/>

    <!-- 大号水印纸飞机 -->
    <g transform="translate(1010,92) scale(7.6)" fill="#ffffff" opacity="0.05">
      <path d="M-16-10l35-14c1.5-.6 3 .5 2.8 2.2l-5.5 27c-.3 1.5-2 2.1-3.2 1l-7-6.5-5.5 4.5c-1 .8-2.5.2-2.7-1.1l-2-9.5-8.5-3c-1.5-.5-1.5-2.5 0-3z"/>
    </g>
    <!-- 柔光斑(只加亮,不压暗)-->
    <circle cx="560" cy="-40" r="150" fill="#ffffff" opacity="0.05"/>
    <circle cx="150" cy="210" r="120" fill="#ffffff" opacity="0.04"/>

    <rect width="1200" height="180" fill="url(#sheen)"/>
    <!-- 顶部玻璃高光线 -->
    <rect x="22" y="1.5" width="1156" height="1.5" rx="0.75" fill="#ffffff" opacity="0.25"/>

    <!-- 图标玻璃方砖 -->
    <g filter="url(#ds)">
      <rect x="64" y="44" width="92" height="92" rx="26" fill="url(#tile)"/>
    </g>
    <rect x="64.75" y="44.75" width="90.5" height="90.5" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
    <g transform="translate(110,90) scale(1.5)">
      <path d="M-16-10l35-14c1.5-.6 3 .5 2.8 2.2l-5.5 27c-.3 1.5-2 2.1-3.2 1l-7-6.5-5.5 4.5c-1 .8-2.5.2-2.7-1.1l-2-9.5-8.5-3c-1.5-.5-1.5-2.5 0-3z" fill="url(#plane)"/>
      <path d="M-2.5 1l8-12" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 文案 -->
    <text x="192" y="76" class="f" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="0.2">Telegram 账号市场</text>
    <rect x="194" y="89" width="46" height="3" rx="1.5" fill="#8ad5ff"/>
    <text x="192" y="120" class="f" fill="#d6efff" font-size="16" opacity="0.92" letter-spacing="0.2">在线状态实时检测 · 全自动发货 · 7×24 小时服务</text>

    <!-- CTA -->
    <g filter="url(#ds)"><rect x="952" y="50" width="192" height="50" rx="14" fill="#ffffff"/></g>
    <text x="1048" y="79" class="f" fill="#0f5c97" font-size="18" font-weight="800" text-anchor="middle">立即浏览  →</text>

    <!-- 玻璃标签 -->
    <g class="f" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
      <rect x="952" y="116" width="60" height="26" rx="8" fill="#ffffff" opacity="0.14"/>
      <text x="982" y="133">自动发货</text>
      <rect x="1018" y="116" width="60" height="26" rx="8" fill="#ffffff" opacity="0.14"/>
      <text x="1048" y="133">状态检测</text>
      <rect x="1084" y="116" width="60" height="26" rx="8" fill="#ffffff" opacity="0.14"/>
      <text x="1114" y="133">全天在线</text>
    </g>
  </g>
</svg>
