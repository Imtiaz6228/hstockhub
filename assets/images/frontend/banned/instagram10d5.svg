<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.3" stop-color="#ef4444"/>
      <stop offset="0.6" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="icon-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="180" rx="20" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="1080" cy="30" r="130" fill="#fff" opacity="0.04"/>
  <circle cx="50" cy="170" r="90" fill="#fff" opacity="0.05"/>
  <circle cx="800" cy="150" r="60" fill="#fff" opacity="0.03"/>

  <!-- Hearts & camera decorations -->
  <g opacity="0.07" fill="#fff">
    <path d="M880 35l4-4a5.5 5.5 0 0 1 8 0l4 4-8 8z"/>
    <path d="M980 135l3-3a4.5 4.5 0 0 1 6.5 0l3 3-6.2 6.5z"/>
    <path d="M350 148l2.5-2.5a3.5 3.5 0 0 1 5 0l2.5 2.5-5 5z"/>
    <circle cx="780" cy="30" r="4"/>
    <circle cx="1150" cy="80" r="3"/>
  </g>

  <!-- Diamond pattern -->
  <g stroke="#fff" stroke-width="0.4" opacity="0.05" fill="none">
    <rect x="660" y="10" width="30" height="30" rx="2" transform="rotate(45 675 25)"/>
    <rect x="720" y="130" width="25" height="25" rx="2" transform="rotate(45 732.5 142.5)"/>
  </g>

  <!-- Icon background -->
  <circle cx="110" cy="90" r="52" fill="#fff" opacity="0.1"/>
  <circle cx="110" cy="90" r="42" fill="#fff" opacity="0.95"/>

  <!-- Instagram camera icon -->
  <g transform="translate(110,90)">
    <rect x="-20" y="-20" width="40" height="40" rx="12" fill="none" stroke="url(#icon-g)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#icon-g)" stroke-width="3.5"/>
    <circle cx="13" cy="-13" r="3" fill="url(#icon-g)"/>
  </g>

  <!-- Text -->
  <text x="195" y="72" class="f" fill="#fff" font-size="30" font-weight="800" letter-spacing="0.5">
    Instagram 账号市场
  </text>
  <text x="195" y="106" class="f" fill="#fef2f2" font-size="17" opacity="0.92">
    真实活跃账号 · 多地区覆盖 · 一站式服务
  </text>
  <rect x="195" y="120" width="50" height="3" rx="1.5" fill="#fff" opacity="0.4"/>

  <!-- CTA Button -->
  <g transform="translate(910,60)">
    <rect width="220" height="50" rx="25" fill="#fff" opacity="0.95"/>
    <text x="110" y="25" class="f" fill="#be123c" font-size="18" font-weight="700"
          text-anchor="middle" dominant-baseline="middle">
      立即浏览 →
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(910,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.18"/>
    <text x="34" y="11" class="f" fill="#fff" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">真实账号</text>
  </g>
  <g transform="translate(988,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.18"/>
    <text x="34" y="11" class="f" fill="#fff" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">多地区</text>
  </g>
  <g transform="translate(1066,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.18"/>
    <text x="34" y="11" class="f" fill="#fff" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">自动发货</text>
  </g>
</svg>
