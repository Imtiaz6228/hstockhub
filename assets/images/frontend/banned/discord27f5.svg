<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </linearGradient>
    <linearGradient id="icon-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="180" rx="20" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="1080" cy="30" r="130" fill="#818cf8" opacity="0.06"/>
  <circle cx="50" cy="160" r="80" fill="#a78bfa" opacity="0.05"/>
  <circle cx="700" cy="170" r="70" fill="#818cf8" opacity="0.04"/>

  <!-- Hexagon pattern -->
  <g stroke="#fff" stroke-width="0.4" opacity="0.04" fill="none">
    <polygon points="820,20 840,10 860,20 860,40 840,50 820,40"/>
    <polygon points="870,60 890,50 910,60 910,80 890,90 870,80"/>
    <polygon points="940,130 960,120 980,130 980,150 960,160 940,150"/>
  </g>

  <!-- Gaming dots -->
  <g opacity="0.06" fill="#fff">
    <circle cx="900" cy="30" r="3"/>
    <circle cx="920" cy="45" r="2"/>
    <circle cx="1000" cy="140" r="2.5"/>
    <circle cx="380" cy="155" r="2"/>
  </g>

  <!-- Icon background -->
  <circle cx="110" cy="90" r="52" fill="#fff" opacity="0.08"/>
  <circle cx="110" cy="90" r="42" fill="#fff" opacity="0.95"/>

  <!-- Discord icon -->
  <g transform="translate(110,90)">
    <path d="M-15 8c2.5 3.5 7 6 15 6s12.5-2.5 15-6c1.5-2.5 2.5-6 2.5-10 0-8.5-2.5-15-2.5-15l-8-3.5-2.5 3.5a30 30 0 0 0-10 0l-2.5-3.5-8 3.5s-2.5 6.5-2.5 15c0 4 1 7.5 2.5 10z"
          fill="url(#icon-g)"/>
    <circle cx="-6" cy="2" r="3.5" fill="#fff"/>
    <circle cx="6" cy="2" r="3.5" fill="#fff"/>
  </g>

  <!-- Text -->
  <text x="195" y="72" class="f" fill="#fff" font-size="30" font-weight="800" letter-spacing="0.5">
    Discord 账号市场
  </text>
  <text x="195" y="106" class="f" fill="#e0e7ff" font-size="17" opacity="0.92">
    优质账号 · Token 服务 · Nitro 订阅 · 安全可靠
  </text>
  <rect x="195" y="120" width="50" height="3" rx="1.5" fill="#a78bfa" opacity="0.5"/>

  <!-- CTA Button -->
  <g transform="translate(910,60)">
    <rect width="220" height="50" rx="25" fill="#fff" opacity="0.95"/>
    <text x="110" y="25" class="f" fill="#4338ca" font-size="18" font-weight="700"
          text-anchor="middle" dominant-baseline="middle">
      立即浏览 →
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(910,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.12"/>
    <text x="34" y="11" class="f" fill="#c7d2fe" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">优质账号</text>
  </g>
  <g transform="translate(988,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.12"/>
    <text x="34" y="11" class="f" fill="#c7d2fe" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">自动发货</text>
  </g>
  <g transform="translate(1066,122)">
    <rect width="68" height="22" rx="11" fill="#fff" opacity="0.12"/>
    <text x="34" y="11" class="f" fill="#c7d2fe" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">安全可靠</text>
  </g>
</svg>
