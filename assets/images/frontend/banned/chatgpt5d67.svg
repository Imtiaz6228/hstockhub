<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.5" stop-color="#065f46"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="icon-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="180" rx="20" fill="url(#bg)"/>

  <!-- Tech-style decorative elements -->
  <circle cx="1100" cy="25" r="130" fill="#10b981" opacity="0.04"/>
  <circle cx="40" cy="160" r="70" fill="#34d399" opacity="0.04"/>

  <!-- Circuit-like lines -->
  <g stroke="#34d399" stroke-width="0.5" opacity="0.06">
    <path d="M700 0v40h50v30" fill="none"/>
    <path d="M850 180v-35h40v-25" fill="none"/>
    <path d="M500 0v25h-30v20" fill="none"/>
    <circle cx="750" cy="40" r="2" fill="#34d399"/>
    <circle cx="890" cy="120" r="2" fill="#34d399"/>
    <circle cx="470" cy="45" r="2" fill="#34d399"/>
  </g>

  <!-- Dot matrix -->
  <g fill="#fff" opacity="0.03">
    <circle cx="800" cy="20" r="1.5"/><circle cx="820" cy="20" r="1.5"/><circle cx="840" cy="20" r="1.5"/>
    <circle cx="800" cy="40" r="1.5"/><circle cx="820" cy="40" r="1.5"/><circle cx="840" cy="40" r="1.5"/>
    <circle cx="800" cy="60" r="1.5"/><circle cx="820" cy="60" r="1.5"/><circle cx="840" cy="60" r="1.5"/>
  </g>

  <!-- Icon background -->
  <circle cx="110" cy="90" r="52" fill="#fff" opacity="0.06"/>
  <circle cx="110" cy="90" r="42" fill="#fff" opacity="0.95"/>

  <!-- ChatGPT icon: chat bubble + AI sparkle -->
  <g transform="translate(110,88)">
    <!-- Chat bubble -->
    <rect x="-20" y="-16" width="40" height="28" rx="8" fill="#10b981"/>
    <polygon points="-6,12 -2,12 -8,19" fill="#10b981"/>
    <!-- Sparkle star (AI symbol) -->
    <path d="M0-8 L1.5-2 L8 0 L1.5 2 L0 8 L-1.5 2 L-8 0 L-1.5-2 Z" fill="#fff"/>
    <!-- Small sparkle top-right -->
    <path d="M11-9 L11.6-7 L14-6.5 L11.6-6 L11-4 L10.4-6 L8-6.5 L10.4-7 Z" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="195" y="72" class="f" fill="#fff" font-size="30" font-weight="800" letter-spacing="0.5">
    ChatGPT 账号市场
  </text>
  <text x="195" y="106" class="f" fill="#a7f3d0" font-size="17" opacity="0.92">
    GPT Plus 账号 · API Key · Claude Pro · AI 资源一站购齐
  </text>
  <rect x="195" y="120" width="50" height="3" rx="1.5" fill="#34d399" opacity="0.5"/>

  <!-- CTA Button -->
  <g transform="translate(910,60)">
    <rect width="220" height="50" rx="25" fill="#10b981"/>
    <text x="110" y="25" class="f" fill="#fff" font-size="18" font-weight="700"
          text-anchor="middle" dominant-baseline="middle">
      立即浏览 →
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(910,122)">
    <rect width="68" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="34" y="11" class="f" fill="#6ee7b7" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">正版资源</text>
  </g>
  <g transform="translate(988,122)">
    <rect width="68" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="34" y="11" class="f" fill="#6ee7b7" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">自动发货</text>
  </g>
  <g transform="translate(1066,122)">
    <rect width="68" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="34" y="11" class="f" fill="#6ee7b7" font-size="11" font-weight="600"
          text-anchor="middle" dominant-baseline="middle">售后保障</text>
  </g>
</svg>
